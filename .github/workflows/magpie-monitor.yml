name: github-repo-monitor

# No scheduled runs — monitoring runs on demand only, via workflow_dispatch
# (instant manual runs, with an optional `since` input to rewind the cursor
# for a deep digest). This keeps the GitHub Actions deployment capability
# without any automatic daily posting.
on:
  workflow_dispatch:
    inputs:
      since:
        description: "Cursor override (ISO 8601 UTC), e.g. 2026-10-01T00:00:00Z — empty = continue from stored cursor"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: github-repo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GitHub repo monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGPIE_MONITOR_REPO: takomitkm/github-repo-monitor
          MAGPIE_MONITOR_STATE: issue
          MAGPIE_MONITOR_POST: "1"
        run: python3 scripts/magpie_monitor.py --since "${{ inputs.since }}"
