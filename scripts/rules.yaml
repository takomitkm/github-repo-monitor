#   评论类 -> 只对通过廉价过滤器的候选 issue 拉评论，最多 --max-enrich 条（默认 20），
#            用于计算 responded / tag: recv|send|recv-q|member-last|assignee-updated 等。
#   评审类 -> 只对候选 PR 拉 reviews（必要时再拉 commits），用于 approved/
